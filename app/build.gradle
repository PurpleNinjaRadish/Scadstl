plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.scad2stl'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.scad2stl'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
    }
}

// No dependencies: the app uses only the Android framework.
