name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk scad2stl.apk
          (cd pc-helper && zip -r ../scad2stl-pc-helper.zip scad2stl_pc_helper.py start-helper.bat)

      - uses: actions/upload-artifact@v4
        with:
          name: scad2stl-apk
          path: scad2stl.apk

      # Also publish the APK as a release so it can be downloaded straight to a phone.
      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          sleep 3
          gh release create latest scad2stl.apk scad2stl-pc-helper.zip \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Debug build of SCAD to STL. Download scad2stl.apk on your phone and open it to install. scad2stl-pc-helper.zip is the optional Windows helper for sending prints through Bambu Connect."
